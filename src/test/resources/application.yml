spring:
  datasource:
    # Base de datos aislada por clase de prueba: 'generate-unique-name' crea un
    # esquema H2 distinto en cada ejecución, de modo que las pruebas no se pisan
    # entre sí ni arrastran datos de una ejecución anterior.
    url: jdbc:h2:mem:medicitas-test-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      encoding: UTF-8

  jpa:
    hibernate:
      # 'none' en las pruebas funcionales: el esquema lo crea schema-h2.sql y nada
      # depende del orden de inicialización. La coherencia entidades-esquema la
      # comprueba EsquemaConsistenteConEntidadesTest, que arranca con 'validate'.
      ddl-auto: none
    show-sql: false
    open-in-view: false

medicitas:
  jwt:
    secret: medicitas-suite-de-pruebas-clave-fija-para-determinismo
  cors:
    allowed-origins: http://localhost:*

logging:
  level:
    root: WARN
    co.edu.monteria.medicitas: WARN
    org.springframework.jdbc.datasource.init: WARN
