server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
    # La API responde siempre en UTF-8. El proyecto maneja tildes y ñ, y si el servidor
    # negociara otra codificación el cliente recibiría texto corrupto.
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: medicitas-backend

  # Carga las credenciales locales de backend/.env (ignorado por git), si existe.
  config:
    import: optional:file:.env[.properties]

  # ---------------------------------------------------------------------------
  # BASE DE DATOS
  # ---------------------------------------------------------------------------
  # Apunta a la instancia de PostgreSQL que levanta 'docker-compose up -d'.
  # Para otro servidor, se sobrescribe con las variables de entorno (o en backend/.env):
  #   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
  # NO se committed ninguna credencial real: el usuario y la contraseña local del
  # entorno de desarrollo se declaran en application-dev.yml.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medicitasdb}
    username: ${SPRING_DATASOURCE_USERNAME:medicitas_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # Sin esto, el script se lee con la codificación por defecto del sistema
      # (windows-1252 en Windows) y los acentos de los datos quedan corruptos
      # antes de llegar a la base de datos.
      encoding: UTF-8

  jpa:
    hibernate:
      # 'none' y no 'update': el esquema vive únicamente en schema.sql.
      #
      # Con 'update', Hibernate modifica la base de datos en cada arranque, que es
      # exactamente lo que no debe ocurrir en un entorno compartido, y además
      # duplicaría la fuente de verdad del esquema. Con 'validate', Hibernate necesita
      # que el script ya se haya ejecutado, lo que introduce una dependencia de orden
      # frágil entre el inicializador de SQL y el EntityManagerFactory. 'none' elimina
      # esa dependencia por completo.
      #
      # La coherencia entre entidades y esquema NO queda sin comprobar: la prueba
      # EsquemaConsistenteConEntidadesTest arranca la aplicación con 'validate' y falla
      # si divergen.
      ddl-auto: none
    show-sql: false
    # El mapeo de entidades a dominio ocurre dentro de la transacción, en los
    # adaptadores de persistencia, así que los objetos que llegan a los
    # controladores ya están completos y no necesitan sesión abierta.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# ---------------------------------------------------------------------------
# CONFIGURACIÓN PROPIA DE MEDICITAS
# ---------------------------------------------------------------------------
medicitas:
  jwt:
    # Sin valor por defecto a propósito. Si MEDICITAS_JWT_SECRET no está definida,
    # JwtAdapter genera una clave aleatoria EFÍMERA y lo avisa por consola: así el
    # proyecto arranca sin configuración, pero ningún secreto queda versionado y
    # ningún token firmado con la clave de otra persona es válido aquí.
    secret: ${MEDICITAS_JWT_SECRET:}
    expiration-ms: ${MEDICITAS_JWT_EXPIRATION_MS:86400000}
  cors:
    # Orígenes autorizadas a invocar la API con credenciales. La app Flutter no es un
    # navegador de origen fijo, así que en desarrollo se declara 'null' como comodín
    # controlado por configuración, no '*' hardcodeado.
    allowed-origins: ${MEDICITAS_CORS_ALLOWED_ORIGINS:http://localhost:*}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    co.edu.monteria.medicitas: INFO
